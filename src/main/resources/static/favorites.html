<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Favorites & Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;800&family=Griffy&family=Lavishly+Yours&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f7; margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .announcement-bar {
            width: 100%; background-color: #111; color: #fff; text-align: center;
            padding: 10px 16px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
            font-family: 'Doto', sans-serif !important;
        }
        .navbar {
            display: flex; justify-content: flex-start; align-items: center;
            padding: 20px 40px 10px 40px; width: 100%; max-width: 1400px; margin: 0 auto;
        }
        .brand-logo {
            font-family: 'Griffy', cursive; font-size: 2.2rem; color: #333; text-decoration: none;
            display: flex; align-items: center; gap: 8px;
        }
        .brand-logo img { height: 36px; width: 36px; }
        .main-container {
            flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 10px 20px 60px 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .back-nav-container {
            display: flex;
            justify-content: flex-start;
            margin: 0;
            padding-left: 0;
        }
        .nav-back-btn {
            background: none; border: none; padding: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .nav-back-btn:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
        }
        .nav-back-btn img {
            width: 90px; height: auto; object-fit: contain; border-radius: 50%;
        }

        .header-titles-group {
            text-align: center;
            margin-bottom: 5px;
        }
        .header-title { font-family: 'Griffy', cursive; font-size: 3rem; color: #111; margin: 0; }
        .header-subtitle { font-family: 'Lavishly Yours', cursive; font-size: 2.2rem; color: #e60023; margin: 0; }

        .card {
            background: #ffffff; border-radius: 20px; padding: 30px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 16px;
        }
        .card-title {
            font-family: 'Doto', sans-serif !important; font-weight: 800; font-size: 16px; color: #111;
            text-transform: uppercase; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin: 0;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #444; font-family: 'Doto', sans-serif !important; }
        .form-group input, .form-group textarea, .form-group select {
            padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
            font-family: 'Doto', sans-serif !important; outline: none; background: #fff;
        }
        .checkbox-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 5px;
        }
        .checkbox-label {
            display: flex; align-items: center; gap: 8px; font-family: 'Doto', sans-serif !important;
            font-size: 12px; color: #333; cursor: pointer;
        }
        .checkbox-label input { width: 16px; height: 16px; accent-color: #e60023; cursor: pointer; }

        .btn-save {
            align-self: flex-start; background-color: #e60023; color: #fff; border: none;
            padding: 12px 28px; border-radius: 12px; font-family: 'Doto', sans-serif !important;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .btn-save:hover { background-color: #ad001a; }
        .favorites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 10px; }
        .fav-item-card { background: #fdfdfd; border: 1px solid #eee; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
        .fav-img { width: 100%; height: 160px; object-fit: cover; background-color: #eee; }
        .fav-details { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .fav-title { font-size: 14px; font-weight: 700; color: #111; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-price { font-family: 'Doto', sans-serif !important; color: #e60023; font-weight: 700; font-size: 13px; }
        .btn-remove { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; font-family: 'Doto', sans-serif !important; }
        .btn-remove:hover { color: #e60023; }
        .empty-msg { text-align: center; color: #888; font-family: 'Doto', sans-serif !important; font-size: 13px; padding: 20px; }
    </style>
</head>
<body>

<div class="announcement-bar">MANIFESTING, NOT OVER-CONSUMING 🍎 CURATE WITH INTENTION</div>

<div class="navbar">
    <a href="/index.html" class="brand-logo"><img src="/cleanapple.png" alt="Logo"> My Wishlist</a>
</div>

<div class="main-container">
    <div class="header-titles-group">
        <h1 class="header-title">Personal Center</h1>
        <h2 class="header-subtitle">Your Saved Info & Demographics</h2>
    </div>

    <div class="back-nav-container">
        <button class="nav-back-btn" onclick="window.location.href='index.html'" title="Return to Board">
            <img src="/return-removebg-preview.png" alt="Return Button">
        </button>
    </div>

    <!-- Profile & Basic Info Card -->
    <div class="card">
        <h3 class="card-title">Profile Settings</h3>
        <div class="form-grid">
            <div class="form-group"><label>Display Name</label><input type="text" id="profName" placeholder="Enter name"></div>
            <div class="form-group"><label>Account Email</label><input type="email" id="profEmail" placeholder="Enter email"></div>
        </div>
        <div class="form-grid">
            <div class="form-group"><label>Username Handle</label><input type="text" id="profUsername" placeholder="@handle"></div>
            <div class="form-group"><label>New Password</label><input type="password" id="profPassword" placeholder="Leave blank to keep current"></div>
        </div>
        <div class="form-group"><label>Personal Vision / Tagline</label><textarea id="profBio" rows="2" placeholder="Curate with intention..."></textarea></div>
        <button class="btn-save" onclick="saveProfileInfo()">Save Profile Settings</button>
    </div>

    <!-- Comprehensive Demographics & Lifestyle Card -->
    <div class="card">
        <h3 class="card-title">Demographics & Lifestyle Matrix (For Advanced Analytics)</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Gender Identity</label>
                <select id="demoGender">
                    <option value="">Select gender...</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Non-Binary">Non-Binary</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>
            <div class="form-group">
                <label>Relationship / Marital Status</label>
                <select id="demoMarital">
                    <option value="">Select status...</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="In a Relationship">In a Relationship</option>
                    <option value="Engaged">Engaged</option>
                </select>
            </div>
            <div class="form-group">
                <label>Children Status</label>
                <select id="demoChildren">
                    <option value="">Select status...</option>
                    <option value="No Children">No Children</option>
                    <option value="Has Children">Has Children</option>
                    <option value="Expecting">Expecting</option>
                </select>
            </div>
            <div class="form-group">
                <label>Housing Status</label>
                <select id="demoHousing">
                    <option value="">Select housing...</option>
                    <option value="Homeowner">Homeowner</option>
                    <option value="Renting / Apartment">Renting / Apartment</option>
                    <option value="Living with Family">Living with Family</option>
                    <option value="Student Dormitory">Student Dormitory</option>
                </select>
            </div>
            <div class="form-group">
                <label>Primary Occupation</label>
                <select id="demoOccupation">
                    <option value="">Select occupation...</option>
                    <option value="Student / Graduate Student">Student / Graduate Student</option>
                    <option value="Tech / IT Professional">Tech / IT Professional</option>
                    <option value="Corporate / Business">Corporate / Business</option>
                    <option value="Creative / Designer">Creative / Designer</option>
                    <option value="Entrepreneur / Freelancer">Entrepreneur / Freelancer</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Monthly Disposable Income Tier</label>
                <select id="demoIncome">
                    <option value="">Select income tier...</option>
                    <option value="Under $1,000">Under $1,000</option>
                    <option value="$1,000 - $3,000">$1,000 - $3,000</option>
                    <option value="$3,000 - $6,000">$3,000 - $6,000</option>
                    <option value="$6,000+">$6,000+</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label>Lifestyle & Curation Preferences (Select all that apply)</label>
            <div class="checkbox-grid">
                <label class="checkbox-label"><input type="checkbox" name="lifestyle" value="Minimalist Curation"> Minimalist Curation</label>
                <label class="checkbox-label"><input type="checkbox" name="lifestyle" value="Eco-Conscious / Sustainable"> Eco-Conscious / Sustainable</label>
                <label class="checkbox-label"><input type="checkbox" name="lifestyle" value="Impulse Control Focus"> Impulse Control Focus</label>
                <label class="checkbox-label"><input type="checkbox" name="lifestyle" value="Luxury & Aesthetic Seeker"> Luxury & Aesthetic Seeker</label>
                <label class="checkbox-label"><input type="checkbox" name="lifestyle" value="Tech & Gadget Enthusiast"> Tech & Gadget Enthusiast</label>
                <label class="checkbox-label"><input type="checkbox" name="lifestyle" value="Home Decorator"> Home Decorator</label>
            </div>
        </div>

        <button class="btn-save" onclick="saveDemographics()" style="margin-top: 10px;">Save Demographics Matrix</button>
    </div>

    <!-- Saved Favorites ❤️ Card -->
    <div class="card">
        <h3 class="card-title">Saved Favorites ❤️</h3>
        <div class="form-grid">
            <div class="form-group"><label>Item Name</label><input type="text" id="newFavTitle" placeholder="Item name"></div>
            <div class="form-group"><label>Price ($)</label><input type="number" id="newFavPrice" placeholder="0.00"></div>
        </div>
        <div class="form-group"><label>Image URL</label><input type="text" id="newFavImg" placeholder="https://example.com/image.jpg"></div>
        <button class="btn-save" style="background-color: #111;" onclick="addFavoriteItem()">Add to Favorites</button>
        <div class="favorites-grid" id="favsContainer"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Prioritize local storage values over the server API fallback
        document.getElementById('profName').value = localStorage.getItem('wishlist_user_name') || '';
        document.getElementById('profEmail').value = localStorage.getItem('wishlist_user_email') || '';
        document.getElementById('profUsername').value = localStorage.getItem('wishlist_username') || '';

        // Fetch live user info from the backend API as a secondary fallback if localStorage is empty
        fetch('/api/user/me')
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(user => {
                if (user) {
                    if (!localStorage.getItem('wishlist_user_name') && user.name) {
                        document.getElementById('profName').value = user.name;
                    }
                    if (!localStorage.getItem('wishlist_user_email') && user.email) {
                        document.getElementById('profEmail').value = user.email;
                    }
                    if (!localStorage.getItem('wishlist_username') && user.username) {
                        document.getElementById('profUsername').value = user.username;
                    }
                }
            })
            .catch(() => {
                // Ignore fetch errors since localStorage is already populated
            });

        document.getElementById('profBio').value = localStorage.getItem('wishlist_tagline') || '';

        // Load Demographics
        document.getElementById('demoGender').value = localStorage.getItem('demo_gender') || '';
        document.getElementById('demoMarital').value = localStorage.getItem('demo_marital') || '';
        document.getElementById('demoChildren').value = localStorage.getItem('demo_children') || '';
        document.getElementById('demoHousing').value = localStorage.getItem('demo_housing') || '';
        document.getElementById('demoOccupation').value = localStorage.getItem('demo_occupation') || '';
        document.getElementById('demoIncome').value = localStorage.getItem('demo_income') || '';

        const savedLifestyle = JSON.parse(localStorage.getItem('demo_lifestyle') || '[]');
        document.querySelectorAll('input[name="lifestyle"]').forEach(cb => {
            if (savedLifestyle.includes(cb.value)) cb.checked = true;
        });

        renderFavorites();
    });

    function saveProfileInfo() {
        localStorage.setItem('wishlist_user_name', document.getElementById('profName').value);
        localStorage.setItem('wishlist_user_email', document.getElementById('profEmail').value);
        localStorage.setItem('wishlist_username', document.getElementById('profUsername').value);
        localStorage.setItem('wishlist_tagline', document.getElementById('profBio').value);

        const newPassword = document.getElementById('profPassword').value;
        if (newPassword) {
            localStorage.setItem('wishlist_password_updated', 'true');
        }

        alert('Profile settings saved successfully!');
        document.getElementById('profPassword').value = '';
    }

    function saveDemographics() {
        localStorage.setItem('demo_gender', document.getElementById('demoGender').value);
        localStorage.setItem('demo_marital', document.getElementById('demoMarital').value);
        localStorage.setItem('demo_children', document.getElementById('demoChildren').value);
        localStorage.setItem('demo_housing', document.getElementById('demoHousing').value);
        localStorage.setItem('demo_occupation', document.getElementById('demoOccupation').value);
        localStorage.setItem('demo_income', document.getElementById('demoIncome').value);

        const lifestyles = [];
        document.querySelectorAll('input[name="lifestyle"]:checked').forEach(cb => lifestyles.push(cb.value));
        localStorage.setItem('demo_lifestyle', JSON.stringify(lifestyles));

        alert('Demographics & lifestyle matrix saved successfully!');
    }

    function getFavorites() { return JSON.parse(localStorage.getItem('wishlist_favorites') || '[]'); }
    function renderFavorites() {
        const container = document.getElementById('favsContainer');
        const items = getFavorites();
        if (items.length === 0) { container.innerHTML = '<div class="empty-msg">No favorite items saved yet.</div>'; return; }
        container.innerHTML = items.map((item, index) => `
            <div class="fav-item-card">
                <img class="fav-img" src="${item.image || 'https://via.placeholder.com/200'}" alt="${item.title}">
                <div class="fav-details">
                    <p class="fav-title">${item.title}</p>
                    <span class="fav-price">$${item.price || '0'}</span>
                    <button class="btn-remove" onclick="removeFavorite(${index})">Delete</button>
                </div>
            </div>
        `).join('');
    }
    function addFavoriteItem() {
        const title = document.getElementById('newFavTitle').value.trim();
        const price = document.getElementById('newFavPrice').value.trim();
        const image = document.getElementById('newFavImg').value.trim();
        if (!title) { alert('Please enter an item name.'); return; }
        const items = getFavorites();
        items.push({ title, price, image });
        localStorage.setItem('wishlist_favorites', JSON.stringify(items));
        document.getElementById('newFavTitle').value = '';
        document.getElementById('newFavPrice').value = '';
        document.getElementById('newFavImg').value = '';
        renderFavorites();
    }
    function removeFavorite(index) {
        const items = getFavorites();
        items.splice(index, 1);
        localStorage.setItem('wishlist_favorites', JSON.stringify(items));
        renderFavorites();
    }
</script>
</body>
</html>
