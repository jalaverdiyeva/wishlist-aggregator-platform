# Google OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=your-client-id-here
spring.security.oauth2.client.registration.google.client-secret=your-client-secret-here
spring.security.oauth2.client.registration.google.scope=profile, email

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Database Connection (PostgreSQL) - Updated to use host.docker.internal for Docker connectivity
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/wishlist_db
spring.datasource.username=aniceperson
spring.datasource.password=your_password

# Redis Caching Configuration - Updated to use host.docker.internal for Docker connectivity
spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.wishlistService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.wishlistService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.wishlistService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.wishlistService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.wishlistService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.wishlistService.slowCallDurationThreshold=2s
resilience4j.circuitbreaker.instances.wishlistService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.wishlistService.permittedNumberOfCallsInHalfOpenState=3