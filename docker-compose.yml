version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wishlist_postgres
    environment:
      POSTGRES_DB: wishlist_db
      POSTGRES_USER: aniceperson
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wishlist_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: wishlist_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wishlist_db
      - SPRING_DATASOURCE_USERNAME=aniceperson
      - SPRING_DATASOURCE_PASSWORD=your_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: